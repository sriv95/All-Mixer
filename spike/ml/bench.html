<!doctype html><meta charset="utf-8"><title>ORT bench</title>
<script type="module">
import * as ort from '/node_modules/onnxruntime-web/dist/ort.webgpu.min.mjs';
ort.env.wasm.wasmPaths = '/node_modules/onnxruntime-web/dist/';
const pct = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.ceil(p * s.length) - 1)]; };
window.gpuInfo = async () => {
  if (!navigator.gpu) return null;
  const a = await navigator.gpu.requestAdapter();
  if (!a) return null;
  const i = a.info || {};

};
window.bench = async ({ url, ep, threads, shape, runs }) => {
  ort.env.wasm.numThreads = threads || 1;

  let t = performance.now();
  const buf = await (await fetch(url)).arrayBuffer();
  const fetchMs = performance.now() - t;
  t = performance.now();

  const data = new Float32Array(n);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const feeds = { [sess.inputNames[0]]: new ort.Tensor('float32', data, shape) };

  const firstMs = await once();
  const times = [];

  const heap1 = performance.memory?.usedJSHeapSize;
  await sess.release();
  return { outDims: window.__dims, downloadBytes: buf.byteLength, fetchMs, createMs, firstMs, p50: pct(times, 0.5), p95: pct(times, 0.95), min: Math.min(...times), jsHeapDeltaMB: heap1 && heap0 ? (heap1 - heap0) / 1048576 : null };
};
window.ready = true;
</script>
