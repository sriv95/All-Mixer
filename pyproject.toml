[project]
name = "all-mixer-model-tools"
version = "0.0.0"
description = "Python tooling that builds the ML models for the extension (not shipped): bun run fetch-model, bun run export-roformer"
requires-python = ">=3.12,<3.13"
dependencies = [
  # scripts/mdx-to-fp16.py
  "onnx",
  "onnxconverter-common",
  # scripts/export-roformer.py
  "torch",
  "einops",
  "rotary-embedding-torch",
  "librosa",
  "pyyaml",
  "beartype",
  "onnxruntime",
  "onnxscript",
  "audio-separator[cpu]",
  "audioread",
]

[tool.uv]
package = false
