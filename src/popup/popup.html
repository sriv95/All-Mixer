<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>All Mixer!</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div role="tablist" aria-label="Mode">
      <button role="tab" id="tab-default" aria-controls="panel-default" data-mode="default">Default mode</button>
      <button role="tab" id="tab-separate" aria-controls="panel-separate" data-mode="separate">Separate mode</button>
    </div>

    <section role="tabpanel" id="panel-default" aria-labelledby="tab-default">
      <label for="master">Master volume</label>
      <div class="row">
        <input id="master" type="range" min="0" max="600" step="5" value="100" />
        <output id="master-value" for="master">100%</output>
      </div>
      <button id="master-reset" type="button">Reset to 100%</button>
    </section>

    <section role="tabpanel" id="panel-separate" aria-labelledby="tab-separate" hidden>
      <label for="vocal">Vocal</label>
      <div class="row">
        <input id="vocal" type="range" min="0" max="600" step="5" value="100" />
        <output id="vocal-value" for="vocal">100%</output>
      </div>
      <label for="instrumental">Instrumental</label>
      <div class="row">
        <input id="instrumental" type="range" min="0" max="600" step="5" value="100" />
        <output id="instrumental-value" for="instrumental">100%</output>
      </div>
      <label for="ml-model">Model</label>
      <select id="ml-model">
        <option value="mdx">MDX-Net 9482 + Spleeter (default)</option>
        <option value="roformer">Mel-Band RoFormer (experimental, heavy)</option>
        <option value="roformer-inst">Mel-Band RoFormer, Karaoke tuned (experimental, heavy)</option>
      </select>
      <div class="presets" role="group" aria-label="Presets">
        <button type="button" id="preset-karaoke" data-vocal="0" data-instrumental="100" aria-pressed="false">Karaoke</button>
        <button type="button" id="preset-half-karaoke" data-vocal="50" data-instrumental="100" aria-pressed="false">Half Karaoke</button>
        <button type="button" id="preset-acappella" data-vocal="100" data-instrumental="0" aria-pressed="false">A cappella</button>
        <button type="button" id="preset-reset" data-vocal="100" data-instrumental="100" aria-pressed="false">Reset</button>
      </div>
    </section>

    <p id="status" class="status" role="status"></p>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
