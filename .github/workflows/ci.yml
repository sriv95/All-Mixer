# CI (SRI-73, SRI-194): lint, typecheck and unit tests when a PR is merged to main
# (a push to main). Not run on every PR push or branch push.
# The full build needs the ML model and runs in release.yml.
name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
