# CI (SRI-73, SRI-194): lint, typecheck and unit tests only when a PR is merged to main.
# Also runs on a push to main that changes package.json (new version).
# Not run on PR pushes, branch pushes or other pushes to main.
# The full build needs the ML model and runs in release.yml; the Firefox check builds with empty stand-in model files.
name: CI

on:
  push:
    branches: [main]
    paths: [package.json]
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # The build only checks that the model files exist, so empty stand-ins are enough to build and lint the add-on.
      - name: Build and lint Firefox add-on
        run: |
          touch public/ml/vocals.onnx public/ml/mdx.onnx
          bun run build:firefox
          npx --yes web-ext@10 lint --source-dir dist-firefox
